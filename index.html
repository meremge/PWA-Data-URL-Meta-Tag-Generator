        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-brand-500 selection:text-white">

    <!-- Header Section -->
    <header class="border-b border-dark-border bg-dark-card/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-brand-600 rounded-xl shadow-lg shadow-brand-500/20 text-white">
                    <i class="fa-solid fa-bolt text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl sm:text-2xl tracking-tight text-white flex items-center gap-2">
                        PWA Data URL Generator
                        <span class="text-xs bg-brand-500/20 text-brand-500 border border-brand-500/30 font-semibold px-2.5 py-0.5 rounded-full">v2.0 PNG Engine</span>
                    </h1>
                    <p class="text-xs text-slate-400">1ファイルPWA量産用・Canvas PNG変換＆メタタグ自動生成</p>
                </div>
            </div>
            
            <!-- Preset Switchers -->
            <div class="flex items-center gap-2 flex-wrap">
                <button onclick="loadPreset('todo')" class="text-xs font-semibold px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-lg transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-list-check text-brand-500"></i> TODOプリセット
                </button>
                <button onclick="loadPreset('memo')" class="text-xs font-semibold px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-lg transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-note-sticky text-amber-400"></i> メモ帳プリセット
                </button>
                <button onclick="loadPreset('tool')" class="text-xs font-semibold px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-lg transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-toolbox text-emerald-400"></i> ツールプリセット
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column: Input Form & Config -->
        <section class="lg:col-span-5 space-y-6">
            <div class="bg-dark-card border border-dark-border rounded-2xl p-5 sm:p-6 shadow-xl space-y-5">
                <div class="flex items-center justify-between border-b border-dark-border pb-3">
                    <h2 class="font-semibold text-lg text-white flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-brand-500"></i> PWA & アプリ設定
                    </h2>
                    <span class="text-xs text-slate-400">リアルタイムPNG変換</span>
                </div>

                <!-- Basic Meta Info -->
                <div class="space-y-4">
                    <div>
                        <label for="appTitle" class="block text-xs font-medium text-slate-300 mb-1">アプリ名 (App Title)</label>
                        <input type="text" id="appTitle" value="マイアプリ" class="w-full bg-dark-input border border-dark-border rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-brand-500 transition-colors">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label for="themeColor" class="block text-xs font-medium text-slate-300 mb-1">テーマカラー</label>
                            <div class="flex items-center gap-2">
                                <input type="color" id="themeColor" value="#6366f1" class="h-9 w-10 bg-transparent cursor-pointer rounded border border-dark-border">
                                <input type="text" id="themeColorHex" value="#6366f1" class="w-full bg-dark-input border border-dark-border rounded-xl px-3 py-2 text-xs font-mono text-white focus:outline-none focus:border-brand-500 uppercase">
                            </div>
                        </div>

                        <div>
                            <label for="bgColor" class="block text-xs font-medium text-slate-300 mb-1">背景色 (Background)</label>
                            <div class="flex items-center gap-2">
                                <input type="color" id="bgColor" value="#0f172a" class="h-9 w-10 bg-transparent cursor-pointer rounded border border-dark-border">
                                <input type="text" id="bgColorHex" value="#0f172a" class="w-full bg-dark-input border border-dark-border rounded-xl px-3 py-2 text-xs font-mono text-white focus:outline-none focus:border-brand-500 uppercase">
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label for="displayMode" class="block text-xs font-medium text-slate-300 mb-1">表示モード (Display)</label>
                            <select id="displayMode" class="w-full bg-dark-input border border-dark-border rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-500">
                                <option value="standalone" selected>standalone (アプリ風)</option>
                                <option value="fullscreen">fullscreen (全画面)</option>
                                <option value="minimal-ui">minimal-ui</option>
                                <option value="browser">browser</option>
                            </select>
                        </div>
                        <div>
                            <label for="orientation" class="block text-xs font-medium text-slate-300 mb-1">画面向き (Orientation)</label>
                            <select id="orientation" class="w-full bg-dark-input border border-dark-border rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-500">
                                <option value="portrait">portrait (縦固定)</option>
                                <option value="any" selected>any (自動回転)</option>
                                <option value="landscape">landscape (横固定)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Icon Generator Mode Switcher -->
                    <div class="space-y-3 pt-2 border-t border-dark-border">
                        <label class="block text-xs font-medium text-slate-300">アイコン設定方式</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button type="button" id="tabEmoji" onclick="setIconMode('emoji')" class="py-2 text-xs font-semibold rounded-xl border transition-all bg-brand-600 text-white border-brand-500 shadow-md">
                                <i class="fa-solid fa-face-smile"></i> 絵文字で自動生成
                            </button>
                            <button type="button" id="tabFile" onclick="setIconMode('file')" class="py-2 text-xs font-semibold rounded-xl border transition-all bg-dark-input text-slate-400 border-dark-border hover:border-slate-600">
                                <i class="fa-solid fa-image"></i> 画像ファイルを選択
                            </button>
                        </div>

                        <!-- Emoji Input Area -->
                        <div id="emojiInputArea" class="space-y-1 pt-1">
                            <label for="iconEmoji" class="block text-[11px] text-slate-400">アイコン用絵文字 (1文字推奨)</label>
                            <input type="text" id="iconEmoji" value="⚡" class="w-full bg-dark-input border border-dark-border rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-brand-500 font-mono text-center text-xl">
                        </div>

                        <!-- File Upload Area -->
                        <div id="fileInputArea" class="hidden space-y-1 pt-1">
                            <label for="iconFile" class="block text-[11px] text-slate-400">画像ファイル (PNG / JPG)</label>
                            <input type="file" id="iconFile" accept="image/*" class="w-full bg-dark-input border border-dark-border rounded-xl px-3 py-1.5 text-xs text-slate-300 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-brand-600 file:text-white hover:file:bg-brand-500 cursor-pointer">
                        </div>
                    </div>
                </div>

                <!-- Custom Manifest JSON Editor -->
                <div class="pt-2">
                    <div class="flex items-center justify-between mb-1">
                        <label for="jsonInput" class="block text-xs font-medium text-slate-300">manifest.json (拡張・詳細設定)</label>
                        <button onclick="formatJson()" class="text-[10px] text-brand-500 hover:text-brand-400 font-semibold flex items-center gap-1">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> 成形
                        </button>
                    </div>
                    <textarea id="jsonInput" rows="5" class="w-full bg-dark-input border border-dark-border rounded-xl p-3 text-xs font-mono text-emerald-400 focus:outline-none focus:border-brand-500 transition-colors leading-relaxed"></textarea>
                </div>
            </div>
        </section>

        <!-- Right Column: Generated Code & Outputs -->
        <section class="lg:col-span-7 space-y-6">
            
            <!-- Output 1: Meta Tags block -->
            <div class="bg-dark-card border border-dark-border rounded-2xl p-5 sm:p-6 shadow-xl space-y-3">
                <div class="flex items-center justify-between">
                    <h3 class="font-semibold text-sm text-white flex items-center gap-2">
                        <i class="fa-solid fa-tags text-brand-500"></i> PWA Header Meta & Manifest Tags
                    </h3>
                    <button onclick="copyToClipboard('outMetaTags', this)" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5 active:scale-95">
                        <i class="fa-regular fa-copy"></i> <span>コピー</span>
                    </button>
                </div>
                <div class="relative">
                    <textarea id="outMetaTags" readonly rows="5" class="w-full bg-dark-input border border-dark-border rounded-xl p-3 text-xs font-mono text-slate-300 focus:outline-none resize-none leading-relaxed"></textarea>
                </div>
            </div>

            <!-- Output 2: Manifest Data URL only -->
            <div class="bg-dark-card border border-dark-border rounded-2xl p-5 sm:p-6 shadow-xl space-y-3">
                <div class="flex items-center justify-between">
                    <h3 class="font-semibold text-sm text-white flex items-center gap-2">
                        <i class="fa-solid fa-link text-emerald-400"></i> Manifest Data URL (単体)
                    </h3>
                    <button onclick="copyToClipboard('outManifestDataUrl', this)" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5 active:scale-95">
                        <i class="fa-regular fa-copy"></i> <span>コピー</span>
                    </button>
                </div>
                <input type="text" id="outManifestDataUrl" readonly class="w-full bg-dark-input border border-dark-border rounded-xl px-3.5 py-2.5 text-xs font-mono text-emerald-400 focus:outline-none">
            </div>

            <!-- Output 3: Full Template HTML -->
            <div class="bg-dark-card border border-dark-border rounded-2xl p-5 sm:p-6 shadow-xl space-y-3">
                <div class="flex items-center justify-between">
                    <h3 class="font-semibold text-sm text-white flex items-center gap-2">
                        <i class="fa-solid fa-file-code text-cyan-400"></i> 完成1ファイル PWA テンプレート (HTML)
                    </h3>
                    <button onclick="copyToClipboard('outFullHtml', this)" class="text-xs bg-brand-600 hover:bg-brand-500 text-white font-medium px-3.5 py-1.5 rounded-lg shadow-lg shadow-brand-500/20 transition-all flex items-center gap-1.5 active:scale-95">
                        <i class="fa-regular fa-copy"></i> <span>全コードコピー</span>
                    </button>
                </div>
                <textarea id="outFullHtml" readonly rows="12" class="w-full bg-dark-input border border-dark-border rounded-xl p-3 text-xs font-mono text-cyan-200 focus:outline-none resize-none leading-relaxed"></textarea>
            </div>

        </section>
    </main>

    <!-- Hidden Canvas for PNG Generation -->
    <canvas id="iconCanvas" width="512" height="512" class="hidden"></canvas>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-brand-600 text-white text-xs font-semibold px-4 py-3 rounded-xl shadow-2xl transition-all duration-300 opacity-0 translate-y-4 pointer-events-none flex items-center gap-2 z-50">
        <i class="fa-solid fa-circle-check text-base"></i>
        <span id="toastMsg">クリップボードにコピーしました！</span>
    </div>

    <!-- Footer -->
    <footer class="border-t border-dark-border py-4 text-center text-xs text-slate-500">
        <p>© 2026 秘密のスペック - High-Speed Single-File PWA Architecture (v2.0 Canvas PNG Engine)</p>
    </footer>

    <!-- Application Script -->
    <script>
        let currentIconMode = 'emoji'; // 'emoji' or 'file'
        let uploadedImageBase64 = '';

        const presets = {
            todo: {
                title: "マイTODOアプリ",
                themeColor: "#6366f1",
                bgColor: "#0f172a",
                display: "standalone",
                orientation: "portrait",
                emoji: "⚡",
                desc: "タスク管理・ToDoスタンドとして稼働中！"
            },
            memo: {
                title: "マイメモパッド",
                themeColor: "#f59e0b",
                bgColor: "#1c1917",
                display: "standalone",
                orientation: "portrait",
                emoji: "📝",
                desc: "クイックメモ・ノートアプリケーションとして稼働中！"
            },
            tool: {
                title: "マイ便利ツール",
                themeColor: "#10b981",
                bgColor: "#064e3b",
                display: "standalone",
                orientation: "portrait",
                emoji: "🛠️",
                desc: "ユーティリティ・ミニツールとして稼働中！"
            }
        };

        const appTitleEl = document.getElementById('appTitle');
        const themeColorEl = document.getElementById('themeColor');
        const themeColorHexEl = document.getElementById('themeColorHex');
        const bgColorEl = document.getElementById('bgColor');
        const bgColorHexEl = document.getElementById('bgColorHex');
        const displayModeEl = document.getElementById('displayMode');
        const orientationEl = document.getElementById('orientation');
        const iconEmojiEl = document.getElementById('iconEmoji');
        const iconFileEl = document.getElementById('iconFile');
        const jsonInputEl = document.getElementById('jsonInput');

        const outMetaTagsEl = document.getElementById('outMetaTags');
        const outManifestDataUrlEl = document.getElementById('outManifestDataUrl');
        const outFullHtmlEl = document.getElementById('outFullHtml');

        const iconCanvas = document.getElementById('iconCanvas');
        const ctx = iconCanvas.getContext('2d');

        window.addEventListener('DOMContentLoaded', () => {
            loadPreset('todo');
            setupEventListeners();
        });

        function setIconMode(mode) {
            currentIconMode = mode;
            const tabEmoji = document.getElementById('tabEmoji');
            const tabFile = document.getElementById('tabFile');
            const emojiArea = document.getElementById('emojiInputArea');
            const fileArea = document.getElementById('fileInputArea');

            if (mode === 'emoji') {
                tabEmoji.className = "py-2 text-xs font-semibold rounded-xl border transition-all bg-brand-600 text-white border-brand-500 shadow-md";
                tabFile.className = "py-2 text-xs font-semibold rounded-xl border transition-all bg-dark-input text-slate-400 border-dark-border hover:border-slate-600";
                emojiArea.classList.remove('hidden');
                fileArea.classList.add('hidden');
            } else {
                tabFile.className = "py-2 text-xs font-semibold rounded-xl border transition-all bg-brand-600 text-white border-brand-500 shadow-md";
                tabEmoji.className = "py-2 text-xs font-semibold rounded-xl border transition-all bg-dark-input text-slate-400 border-dark-border hover:border-slate-600";
                fileArea.classList.remove('hidden');
                emojiArea.classList.add('hidden');
            }
            generateAll();
        }

        function setupEventListeners() {
            themeColorEl.addEventListener('input', (e) => {
                themeColorHexEl.value = e.target.value;
                generateAll();
            });
            themeColorHexEl.addEventListener('input', (e) => {
                themeColorEl.value = e.target.value;
                generateAll();
            });

            bgColorEl.addEventListener('input', (e) => {
                bgColorHexEl.value = e.target.value;
                generateAll();
            });
            bgColorHexEl.addEventListener('input', (e) => {
                bgColorEl.value = e.target.value;
                generateAll();
            });

            [appTitleEl, displayModeEl, orientationEl, iconEmojiEl].forEach(el => {
                el.addEventListener('input', generateAll);
            });

            iconFileEl.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (event) => {
                    uploadedImageBase64 = event.target.result;
                    await generateAll();
                };
                reader.readAsDataURL(file);
            });
        }

        function loadPreset(key) {
            const data = presets[key];
            if (!data) return;

            appTitleEl.value = data.title;
            themeColorEl.value = data.themeColor;
            themeColorHexEl.value = data.themeColor;
            bgColorEl.value = data.bgColor;
            bgColorHexEl.value = data.bgColor;
            displayModeEl.value = data.display;
            orientationEl.value = data.orientation;
            iconEmojiEl.value = data.emoji;

            generateAll();
        }

        // Robust Asynchronous PNG Data URL Generator via Canvas
        async function generatePngDataUrl() {
            const themeColor = themeColorHexEl.value || "#6366f1";
            ctx.clearRect(0, 0, 512, 512);

            // 1. Draw Background (with rounded corners for maskable safety)
            ctx.fillStyle = themeColor;
            ctx.fillRect(0, 0, 512, 512);

            if (currentIconMode === 'emoji') {
                const emoji = iconEmojiEl.value.trim() || "⚡";
                ctx.font = "280px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(emoji, 256, 276);
                return iconCanvas.toDataURL('image/png');
            } else {
                if (!uploadedImageBase64) {
                    ctx.font = "280px sans-serif";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("⚡", 256, 276);
                    return iconCanvas.toDataURL('image/png');
                }
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => {
                        const size = 384;
                        const offset = (512 - size) / 2;
                        ctx.drawImage(img, offset, offset, size, size);
                        resolve(iconCanvas.toDataURL('image/png'));
                    };
                    img.src = uploadedImageBase64;
                });
            }
        }

        // Core Generation Logic with strictly awaited Async-to-PNG workflow
        async function generateAll() {
            const title = appTitleEl.value || "マイアプリ";
            const themeColor = themeColorHexEl.value || "#6366f1";
            const bgColor = bgColorHexEl.value || "#0f172a";
            const display = displayModeEl.value;
            const orientation = orientationEl.value;

            // Await Canvas rendering reliably regardless of mode
            const iconPngDataUrl = await generatePngDataUrl();

            // Build Manifest Object
            let manifestObj = {
                name: title,
                short_name: title.length > 10 ? title.substring(0, 10) + "..." : title,
                start_url: ".",
                display: display,
                background_color: bgColor,
                theme_color: themeColor,
                orientation: orientation,
                icons: [
                    {
                        src: iconPngDataUrl,
                        sizes: "512x512",
                        type: "image/png",
                        purpose: "any maskable"
                    }
                ]
            };

            jsonInputEl.value = JSON.stringify(manifestObj, null, 2);

            const manifestDataUrl = `data:application/json;charset=utf-8,${encodeURIComponent(JSON.stringify(manifestObj))}`;

            const metaTags = `<!-- PWA Essential Meta Tags -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="${themeColor}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="${title}">
<link rel="icon" href="${iconPngDataUrl}">
<link rel="apple-touch-icon" href="${iconPngDataUrl}">
<!-- Inline Manifest Data URL -->
<link rel="manifest" href="${manifestDataUrl}">`;

            const fullHtml = `<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>${title}</title>
${metaTags.split('\n').map(line => '    ' + line).join('\n')}
    <script src="https://cdn.tailwindcss.com"><\/script>
    <style>
        body {
            background-color: ${bgColor};
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4">
    <div class="text-center space-y-4 max-w-md w-full bg-slate-800/80 border border-slate-700 p-6 rounded-2xl shadow-2xl backdrop-blur">
        <div class="flex justify-center mb-2">
            <img src="${iconPngDataUrl}" alt="App Icon" class="w-20 h-20 rounded-2xl shadow-lg border border-slate-600">
        </div>
        <h1 class="text-2xl font-bold text-white">${title}</h1>
        <p class="text-xs text-slate-400">1ファイル PNG-PWA アプリケーションが稼働中！</p>
        <div class="pt-4 border-t border-slate-700">
            <button onclick="alert('PWA動作中！')" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 px-4 rounded-xl transition-all shadow-lg active:scale-95">
                アクションを実行
            </button>
        </div>
    </div>
</body>
</html>`;

            outMetaTagsEl.value = metaTags;
            outManifestDataUrlEl.value = manifestDataUrl;
            outFullHtmlEl.value = fullHtml;
        }

        function formatJson() {
            try {
                const parsed = JSON.parse(jsonInputEl.value);
                jsonInputEl.value = JSON.stringify(parsed, null, 2);
                showToast("JSONを整形しました！");
            } catch (e) {
                showToast("無効なJSONフォーマットです");
            }
        }

        function copyToClipboard(elementId, btn) {
            const el = document.getElementById(elementId);
            if (!el) return;

            el.select();
            el.setSelectionRange(0, 99999);
            try {
                document.execCommand('copy');
                showToast("クリップボードにコピーしました！");
                
                const originalText = btn.innerHTML;
                btn.innerHTML = `<i class="fa-solid fa-check text-emerald-400"></i> <span>完了!</span>`;
                setTimeout(() => {
                    btn.innerHTML = originalText;
                }, 1500);
            } catch (err) {
                showToast("コピーに失敗しました");
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = msg;
            
            toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
            }, 2000);
        }
    </script>
</body>
</html>
